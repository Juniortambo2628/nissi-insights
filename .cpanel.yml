---
deployment:
  tasks:
    # Deploy public assets to the API document root
    - /usr/bin/rsync -a backend/public/ /home/viafgsed/public_html/api/
    # Specifically ensure the production index.php is used
    - /bin/cp backend/public/index.production.php /home/viafgsed/public_html/api/index.php
    # Deploy backend application code to nissi-insights-core
    - /usr/bin/rsync -a backend/app/ /home/viafgsed/nissi-insights-core/app/
    - /usr/bin/rsync -a backend/routes/ /home/viafgsed/nissi-insights-core/routes/
    - /usr/bin/rsync -a backend/database/ /home/viafgsed/nissi-insights-core/database/
    - /usr/bin/rsync -a backend/config/ /home/viafgsed/nissi-insights-core/config/
    - /usr/bin/rsync -a backend/resources/ /home/viafgsed/nissi-insights-core/resources/
    - /usr/bin/rsync -a backend/bootstrap/ /home/viafgsed/nissi-insights-core/bootstrap/

