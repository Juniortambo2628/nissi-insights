name: Deploy Backend to cPanel

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/**'
  workflow_dispatch:

env:
  SERVER_HOST: ${{ secrets.SERVER_HOST }}
  SERVER_USER: ${{ secrets.SERVER_USER }}
  SERVER_PORT: ${{ secrets.SERVER_PORT || '22' }}
  DEPLOY_PATH: /home/${{ secrets.SERVER_USER }}
  APP_PATH: /home/${{ secrets.SERVER_USER }}/nissi-insights-core
  PUBLIC_PATH: /home/${{ secrets.SERVER_USER }}/public_html/api

jobs:
  test:
    name: Run Backend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, tokenizer, sqlite3
          tools: composer:v2

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-interaction

      - name: Run Pest Tests
        working-directory: backend
        run: vendor/bin/pest

  frontend-test:
    name: Run Frontend Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install Dependencies
        working-directory: frontend
        run: npm ci

      - name: Run Jest Tests
        working-directory: frontend
        run: npm test

  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    needs: [test, frontend-test]
    if: success()

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, ctype, json, bcmath, pdo, tokenizer
          tools: composer:v2

      - name: Install Composer Dependencies
        working-directory: backend
        run: composer install --no-dev --optimize-autoloader --no-interaction

      - name: Setup SSH Key
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SSH_PRIVATE_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -p ${{ env.SERVER_PORT }} ${{ env.SERVER_HOST }} >> ~/.ssh/known_hosts 2>/dev/null

      - name: Deploy to Server
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }}" \
            --exclude="vendor" \
            --exclude="storage" \
            --exclude="public" \
            --exclude="tests" \
            --exclude=".git" \
            --exclude=".env" \
            --exclude=".env.*" \
            --exclude="debug_settings.php" \
            --exclude="init_hero_media.php" \
            --exclude="out.txt" \
            backend/ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.APP_PATH }}/

      - name: Deploy Public Assets
        run: |
          rsync -avz --delete \
            -e "ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }}" \
            backend/public/ ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PUBLIC_PATH }}/

      - name: Copy Production Entry Point
        run: |
          scp -P ${{ env.SERVER_PORT }} \
            -i ~/.ssh/deploy_key \
            backend/public/index.production.php \
            ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }}:${{ env.PUBLIC_PATH }}/index.php

      - name: Install Production Dependencies on Server
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd ${{ env.APP_PATH }}
            if [ -f composer.json ]; then
              composer install --no-dev --optimize-autoloader --no-interaction 2>/dev/null || true
            fi
          EOF

      - name: Ensure Imagick Extension
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            PHP_BIN="/opt/cpanel/ea-php83/root/usr/bin/php"
            PECL_BIN="/opt/cpanel/ea-php83/root/usr/bin/pecl"
            PHP_INI="/opt/cpanel/ea-php83/root/etc/php.ini"

            # Already working? Skip.
            if $PHP_BIN -m 2>/dev/null | grep -qi imagick; then
              echo "imagick already loaded, skipping."
              exit 0
            fi

            echo "imagick not loaded, attempting install..."

            # Try to install system libraries + imagick via PECL (needs root/sudo)
            if command -v sudo >/dev/null 2>&1; then
              sudo yum install -y ImageMagick-6-q16 ImageMagick-6-devel 2>/dev/null || \
                sudo dnf install -y ImageMagick-6-q16 ImageMagick-6-devel 2>/dev/null || true

              echo "" | sudo $PECL_BIN install imagick 2>/dev/null || true
            fi

            # Check again after install attempt
            if $PHP_BIN -m 2>/dev/null | grep -qi imagick; then
              echo "imagick installed successfully."

              # Ensure extension is enabled in php.ini
              if ! grep -q "^extension=imagick.so" "$PHP_INI" 2>/dev/null; then
                if grep -q "^;extension=imagick.so" "$PHP_INI" 2>/dev/null; then
                  sed -i 's/^;extension=imagick.so/extension=imagick.so/' "$PHP_INI"
                else
                  echo "extension=imagick.so" >> "$PHP_INI"
                fi
              fi
            else
              echo "imagick install failed, disabling broken extension to suppress errors..."
              # Comment out broken extension=imagick.so to stop the startup warning
              sed -i 's/^extension=imagick.so/;extension=imagick.so/' "$PHP_INI" 2>/dev/null || true
              echo "extension suppressed."
            fi
          EOF

      - name: Restart PHP-FPM
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            # Try cPanel EasyApache service script first, fall back to systemctl
            if [ -x /scripts/restartsrv ]; then
              sudo /scripts/restartsrv ea-php83-php-fpm 2>/dev/null || true
            fi
            sudo systemctl restart ea-php83-php-fpm 2>/dev/null || \
            sudo service ea-php83-php-fpm restart 2>/dev/null || true
          EOF

      - name: Setup Storage Symlink
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd ${{ env.APP_PATH }}/public
            if [ ! -L storage ]; then
              ln -sf ../storage storage
            fi
          EOF

      - name: Set Permissions
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            chmod -R 755 ${{ env.APP_PATH }}/storage 2>/dev/null || true
            chmod -R 755 ${{ env.PUBLIC_PATH }} 2>/dev/null || true
          EOF

      - name: Run Migrations
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd ${{ env.APP_PATH }}
            php artisan migrate --force 2>/dev/null || true
          EOF

      - name: Clear Caches
        run: |
          ssh -i ~/.ssh/deploy_key -p ${{ env.SERVER_PORT }} ${{ env.SERVER_USER }}@${{ env.SERVER_HOST }} << 'EOF'
            cd ${{ env.APP_PATH }}
            php artisan config:cache 2>/dev/null || true
            php artisan route:cache 2>/dev/null || true
            php artisan view:cache 2>/dev/null || true
          EOF

      - name: Cleanup SSH Key
        if: always()
        run: rm -rf ~/.ssh/deploy_key
